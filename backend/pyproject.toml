[project]
name = "nluyxl-backend"
version = "1.0.0"
description = "NLUYXL - Autonomous Business Workspace & AI Agent Engine"
authors = [{ name = "Arshin", email = "heythisisarsh@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "supabase>=2.8.0",
    "psycopg2-binary>=2.9.9",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
